name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # macos-15 ships Xcode 16 (Swift 6), required by swift-tools-version 6.0.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit and integration tests
        run: swift test
      - name: Build the Shell app bundle
        run: bash scripts/build-shell-app.sh "$RUNNER_TEMP/Retro98 Shell.app"
        env:
          RETRO98_SIGNING: adhoc
      - name: Install, uninstall and signing script tests
        run: |
          bash Tests/scripts/test_uninstall.sh
          bash Tests/scripts/test_install.sh
          bash Tests/scripts/test_signing.sh
